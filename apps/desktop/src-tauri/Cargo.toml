[package]
name = "voice-tutor-desktop"
version = "0.1.0"
description = "voice-tutor desktop shell (Tauri 2)"
authors = ["GeneralErdon"]
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "voice_tutor_lib"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }

# WebKitGTK bindings, same major as the one wry uses, for the user-media permission handler.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# https://v2.tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
