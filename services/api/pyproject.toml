[project]
name = "vt-api"
version = "0.1.0"
description = "voice-tutor API: realtime voice session, teacher logic, notes and progress."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "anthropic>=1.14.0",
    "anyio>=4.15.1",
    "fastapi>=0.153.0",
    "httpx2>=2.15.1",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
    "vt-contracts",
]

[project.scripts]
vt-api = "vt_api.__main__:main"
vt-api-openapi = "vt_api.openapi:main"

[tool.uv.sources]
vt-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"
