[project]
name = "vt-pron"
version = "0.1.0"
description = "voice-tutor pronunciation scoring: G2P, wav2vec2 phoneme recognition, alignment, per-phoneme verdicts."
readme = "README.md"
requires-python = ">=3.14,<3.15"
# torch, jaxtyping and beartype arrive in Phase 2 (recognizer); the bootstrap stays light.
dependencies = [
    "fastapi>=0.153.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
    "vt-contracts",
]

[project.scripts]
vt-pron = "vt_pron.__main__:main"

[tool.uv.sources]
vt-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"
