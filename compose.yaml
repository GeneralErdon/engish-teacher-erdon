# voice-tutor: the whole stack. Pick the hardware with a profile (docs/hardware.md):
#
#   docker compose --profile cpu up -d        # or: just up cpu
#   docker compose --profile amd watch        # or: just watch amd  (rebuilds api/pron on change)
#
# api and pron always run. The speech and chat model services come from the profile; each variant
# answers on the network as plain `stt`/`tts` (one Speaches serves both) or `llm`, so the api URLs
# in .env do not change between profiles.
# Every port is published on 127.0.0.1 only: voice-tutor has no authentication.

name: voice-tutor

x-env-file: &env-file
  env_file:
    - path: .env
      required: false

x-model-healthcheck: &model-healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  # First start downloads models (GBs); failures during this window do not count.
  start_period: 2h
  start_interval: 5s

services:
  # ------------------------------------------------------------------ our code
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    <<: *env-file
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # The api owns the speech model files (Settings → Voice downloads and removes them here);
      # Speaches mounts the same folder below and only serves what it finds.
      VT_SPEECH_MODELS_DIR: /data/models
    volumes:
      - ./data:/data
    extra_hosts:
      # `external` profile on Linux: reach Ollama / LM Studio running on the host.
      - "host.docker.internal:host-gateway"
    # Model services only need to be started: the first start downloads GBs, and the api must
    # come up meanwhile (Phase 1 reports each model's readiness in the UI).
    depends_on:
      pron: { condition: service_healthy }
      stt-cpu: { condition: service_started, required: false }
      stt-nvidia: { condition: service_started, required: false }
      stt-gpu: { condition: service_started, required: false }
      llm-cpu: { condition: service_started, required: false }
      llm-nvidia: { condition: service_started, required: false }
      llm-amd: { condition: service_started, required: false }
    restart: unless-stopped
    develop:
      watch:
        - { action: rebuild, path: services/api/src }
        - { action: rebuild, path: packages/contracts/src }
        - { action: rebuild, path: apps/desktop/src }
        - { action: rebuild, path: uv.lock }
        - { action: rebuild, path: pnpm-lock.yaml }

  pron:
    build:
      context: .
      dockerfile: services/pron/Dockerfile
    <<: *env-file
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped
    develop:
      watch:
        - { action: rebuild, path: services/pron/src }
        - { action: rebuild, path: packages/contracts/src }
        - { action: rebuild, path: uv.lock }

  # ------------------------------------------------------------------ speech (Speaches)
  # Speech-to-text (faster-whisper) and the tutor's voice (Kokoro on ONNX Runtime) in one server.
  # `just voice` starts it alone. The first start still pre-downloads the two default models
  # (~700 MB, PRELOAD_MODELS) before the healthcheck passes; later starts find them in ./data/models,
  # the folder the api shares (VT_SPEECH_MODELS_DIR). Other models are downloaded from
  # Settings → Voice. On Linux the container writes there as uid 1000.
  stt-cpu:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    profiles: [cpu, amd, external]
    networks: { default: { aliases: [stt, tts] } }
    environment: &speaches-env
      PRELOAD_MODELS: '["${VT_STT_MODEL:-Systran/faster-distil-whisper-small.en}", "${VT_TTS_MODEL:-speaches-ai/Kokoro-82M-v1.0-ONNX}"]'
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/models:/home/ubuntu/.cache/huggingface/hub
    healthcheck: &speaches-healthcheck
      <<: *model-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
    restart: unless-stopped

  stt-nvidia:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cuda
    profiles: [nvidia]
    networks: { default: { aliases: [stt, tts] } }
    environment: *speaches-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/models:/home/ubuntu/.cache/huggingface/hub
    gpus: all
    healthcheck: *speaches-healthcheck
    restart: unless-stopped

  # ------------------------------------------------------------------ speech (whisper.cpp, GPU)
  # Speech recognition on the GPU through Vulkan (AMD, Intel), as a second engine next to Speaches:
  # `just voice gpu` starts it, and Settings → Voice picks the engine. Linux only (/dev/dri).
  # The image is built without GGML_NATIVE=OFF, so its CPU code may target its CI machine: if the
  # container dies with "Illegal instruction", see docs/hardware.md.
  # stt-gpu-model first fetches the GGML file into ./data/models (a no-op once it is there) with
  # the Speaches image, which already has huggingface_hub. whisper.cpp loads it before the port
  # opens, so the healthcheck waits. The api asks the server to load other models it downloaded.
  stt-gpu-model:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    profiles: [gpu, amd]
    entrypoint:
      - python
      - -c
      - |
        import os, huggingface_hub
        repo, file = os.environ["MODEL"].rsplit("/", 1)
        huggingface_hub.hf_hub_download(repo, file)
    environment:
      MODEL: ${VT_STT_GPU_MODEL:-ggerganov/whisper.cpp/ggml-small.en-q8_0.bin}
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - ./data/models:/home/ubuntu/.cache/huggingface/hub
    restart: "no"

  stt-gpu:
    image: ghcr.io/ggml-org/whisper.cpp:main-vulkan-0c7be696371069e0baa2515ed7aa08d5a5473aa6@sha256:4d25bb2f233afa2799642ffcb3e49dbb5586a3cbf7588f3ec7be727d9fa9acbd
    profiles: [gpu, amd]
    entrypoint: ["/bin/sh", "/opt/voice-tutor/start.sh"]
    environment:
      VT_STT_GPU_MODEL: ${VT_STT_GPU_MODEL:-ggerganov/whisper.cpp/ggml-small.en-q8_0.bin}
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "127.0.0.1:8002:8080"
    volumes:
      - ./data/models:/models:ro
      - ./docker/stt-gpu/start.sh:/opt/voice-tutor/start.sh:ro
    depends_on:
      stt-gpu-model: { condition: service_completed_successfully }
    healthcheck:
      <<: *model-healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/v1/health"]
      # The model is on disk already (stt-gpu-model fetched it): loading it takes seconds.
      start_period: 5m
    # After a failed /load the server exits; it comes back on the default model.
    restart: unless-stopped

  # ------------------------------------------------------------------ chat model
  # llama.cpp server: downloads VT_LLM_HF_REPO from Hugging Face on first start and serves it
  # under the name VT_LLM_MODEL (what the api sends in its requests).
  llm-cpu:
    image: ghcr.io/ggml-org/llama.cpp:server-b11749
    profiles: [cpu]
    networks: { default: { aliases: [llm] } }
    environment: &llama-env
      LLAMA_ARG_HF_REPO: ${VT_LLM_HF_REPO:-ggml-org/gemma-3-4b-it-GGUF}
      LLAMA_ARG_ALIAS: ${VT_LLM_MODEL:-gemma-3-4b-it-q4}
      LLAMA_ARG_CTX_SIZE: ${VT_LLM_CTX_SIZE:-8192}
      LLAMA_CACHE: /models
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - llm-models:/models
    healthcheck: &llama-healthcheck
      <<: *model-healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
    restart: unless-stopped

  llm-amd:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b11749
    profiles: [amd]
    networks: { default: { aliases: [llm] } }
    environment:
      <<: *llama-env
      LLAMA_ARG_N_GPU_LAYERS: "999"
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - llm-models:/models
    healthcheck: *llama-healthcheck
    restart: unless-stopped

  # TODO(Phase 3): pull VT_LLM_MODEL into Ollama on first start (`ollama pull`).
  llm-nvidia:
    image: ollama/ollama:0.40.6
    profiles: [nvidia]
    networks: { default: { aliases: [llm] } }
    environment:
      # Same port as llama.cpp, so VT_LLM_BASE_URL stays http://llm:8080/v1.
      OLLAMA_HOST: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ollama:/root/.ollama
    gpus: all
    healthcheck:
      <<: *model-healthcheck
      test: ["CMD", "ollama", "list"]
    restart: unless-stopped

  # `external` has no llm service: point VT_LLM_BASE_URL at http://host.docker.internal:<port>/v1.

  # TODO(Phase 3): `https` profile with Caddy and its internal CA for LAN access
  # (docker/caddy/Caddyfile, docs/hardware.md#remote-access).

volumes:
  llm-models:
  ollama:
