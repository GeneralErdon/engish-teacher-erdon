# Installable apps, built on GitHub's machines, to download from the run's "Artifacts" section:
# Linux (.deb, .rpm, .AppImage) and Windows (.msi, setup .exe).
#   - after every merge into develop
#   - by hand, any branch: gh workflow run apps.yml --ref <branch> (or the Run workflow button,
#     once this file is on the default branch)
# Releases (`v*` tags, attached to a GitHub release) are built by release.yml.
name: Apps

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes the build in progress.
concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop · ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            installers: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            platform: windows
            installers: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: apps
      - name: Build the installers
        run: pnpm --filter @voice-tutor/desktop tauri build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voice-tutor-${{ matrix.platform }}
          path: ${{ matrix.installers }}
          if-no-files-found: error
          retention-days: 30
