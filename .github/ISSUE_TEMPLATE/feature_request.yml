name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to happen? Alternatives you considered?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Roadmap phase it belongs to (docs/roadmap.md), links, screenshots.
