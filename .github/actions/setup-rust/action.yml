name: Set up Rust
description: Tauri system libraries (Linux), the toolchain pinned in rust-toolchain.toml and the cargo cache.
inputs:
  cache-key:
    description: Extra key to keep caches of different jobs apart.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Tauri system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
          libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
    # Installs the toolchain and components pinned in rust-toolchain.toml.
    - name: Rust toolchain
      shell: bash
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: apps/desktop/src-tauri
        key: ${{ inputs.cache-key }}
