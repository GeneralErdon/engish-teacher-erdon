name: Set up Python
description: uv (same version as the Dockerfiles), Python from .python-version, the locked workspace and just.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: 0.13.4 # keep in sync with UV_VERSION in services/*/Dockerfile
        enable-cache: true
    - uses: $/.github/actions/setup-just
    - name: Install the workspace (locked)
      shell: bash
      run: uv sync --all-packages --locked
