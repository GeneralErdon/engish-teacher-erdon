name: Set up Python
description: uv (same version as the Dockerfiles), Python from .python-version, the locked workspace and just.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: 0.13.4 # keep in sync with UV_VERSION in services/*/Dockerfile
        enable-cache: true
    - uses: $/.github/actions/setup-just
    - name: Install the workspace (locked)
      shell: bash
      run: uv sync --all-packages --locked
